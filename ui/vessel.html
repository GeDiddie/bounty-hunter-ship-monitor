<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bounty Hunter — Vessel</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="vessel-page">
  <header class="top">
    <div class="brand">BOUNTY HUNTER<small>2016 Viking 42 Sport Tower</small></div>
    <div class="mode-pill" id="mode">…</div>
    <div class="actions"><a class="btn" href="/cards">Cards</a></div>
  </header>
  <div class="vessel-shell">
    <section class="plan-wrap">
      <div class="plan-legend">
        <span><i class="dot green"></i>OK</span>
        <span><i class="dot yellow"></i>Watch</span>
        <span><i class="dot red"></i>Alarm</span>
        <span><i class="dot idle"></i>Off / no data</span>
      </div>
      <svg class="plan" viewBox="0 0 400 820" role="img" aria-label="Bounty Hunter 42C deck plan">
        <path class="hull" d="M 78 790 L 78 430 C 78 300, 98 170, 148 70 C 172 28, 228 28, 252 70 C 302 170, 322 300, 322 430 L 322 790 C 322 804, 308 814, 200 814 C 92 814, 78 804, 78 790 Z"/>
        <rect class="hot" data-zone="master" x="128" y="78" width="144" height="88" rx="14"/>
        <text class="lab" x="200" y="128">MASTER</text>
        <rect class="hot" data-zone="guest" x="96" y="178" width="96" height="70" rx="10"/>
        <text class="lab sm" x="144" y="218">GUEST</text>
        <rect class="hot" data-zone="heads" x="208" y="178" width="96" height="70" rx="10"/>
        <text class="lab sm" x="256" y="210">HEADS</text>
        <text class="lab sm" x="256" y="226">HOLDING</text>
        <rect class="hot" data-zone="seakeeper" x="96" y="258" width="96" height="48" rx="8"/>
        <text class="lab sm" x="144" y="286">SEAKEEPER</text>
        <rect class="hot" data-zone="galley" x="208" y="258" width="96" height="48" rx="8"/>
        <text class="lab sm" x="256" y="286">GALLEY</text>
        <rect class="hot" data-zone="salon" x="96" y="316" width="208" height="78" rx="10"/>
        <text class="lab" x="200" y="360">SALON</text>
        <rect class="hot tank" data-zone="fuel" x="104" y="402" width="84" height="28" rx="6"/>
        <text class="lab sm" x="146" y="420">FUEL</text>
        <rect class="hot tank" data-zone="water" x="212" y="402" width="84" height="28" rx="6"/>
        <text class="lab sm" x="254" y="420">WATER</text>
        <rect class="hot helm" data-zone="helm" x="108" y="444" width="184" height="72" rx="10"/>
        <text class="lab" x="200" y="476">HELM</text>
        <text class="lab sm" x="200" y="494">9219 · 8610 · VV7</text>
        <rect class="hot" data-zone="tower" x="164" y="522" width="72" height="28" rx="8"/>
        <text class="lab sm" x="200" y="540">TOWER</text>
        <rect class="hot" data-zone="mezz" x="96" y="560" width="208" height="36" rx="8"/>
        <text class="lab sm" x="200" y="582">MEZZANINE · ER HATCH</text>
        <rect class="hot eng" data-zone="gen" x="146" y="604" width="108" height="36" rx="8"/>
        <text class="lab sm" x="200" y="620">PHASOR</text>
        <text class="val" id="pin-gen" x="200" y="634">—</text>
        <rect class="hot eng" data-zone="port" x="96" y="648" width="96" height="52" rx="8"/>
        <text class="lab sm" x="144" y="668">PORT QSC</text>
        <text class="val" id="pin-port" x="144" y="684">—</text>
        <rect class="hot eng" data-zone="stbd" x="208" y="648" width="96" height="52" rx="8"/>
        <text class="lab sm" x="256" y="668">STBD QSC</text>
        <text class="val" id="pin-stbd" x="256" y="684">—</text>
        <rect class="space" x="88" y="708" width="224" height="78" rx="8"/>
        <text class="lab" x="200" y="752">COCKPIT</text>
        <ellipse class="hot" data-zone="portpod" cx="144" cy="798" rx="30" ry="12"/>
        <text class="lab sm" x="144" y="802">P POD</text>
        <ellipse class="hot" data-zone="stbdpod" cx="256" cy="798" rx="30" ry="12"/>
        <text class="lab sm" x="256" y="802">S POD</text>
      </svg>
    </section>
    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <div>
          <div class="kicker" id="zone-kicker">VESSEL</div>
          <h2 id="zone-title">Overview</h2>
        </div>
        <button class="btn" id="close-drawer" type="button">Close</button>
      </div>
      <p class="hint" id="zone-hint">Tap a space on the plan.</p>
      <div class="grid" id="zone-grid"></div>
    </aside>
  </div>
  <script src="/vessel.js"></script>
</body>
</html>
